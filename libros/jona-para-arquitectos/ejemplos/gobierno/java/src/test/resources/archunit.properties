# Almacén de la deuda congelada (FreezingArchRule), relativo a la carpeta del proyecto y versionado en git.
freeze.store.default.path=deuda-archunit
# Una prueba nunca crea el almacén ni lo modifica en silencio: si falta, o si una violación congelada
# desapareció, la prueba falla. Se actualiza a propósito, en local, con
#   mvn test -Darchunit.freeze.store.default.allowStoreUpdate=true
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
# No volver a congelar: las violaciones nuevas fallan en lugar de sumarse a la deuda.
freeze.refreeze=false
# Un fixture sin Implementación no debe hacer fallar una regla que solo mira Implementaciones.
archRule.failOnEmptyShould=false
