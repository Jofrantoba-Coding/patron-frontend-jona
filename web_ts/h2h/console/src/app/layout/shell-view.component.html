<!--
  shell-view.component.html — JONA View del layout principal.
  Solo estructura y bindings: la navegación y la sesión llegan resueltas.
-->
<!--
  `sidebarClassName` acota el panel a la altura de la ventana en escritorio.

  Sin esto el aside es `lg:static` y, como fila flex, se estira a lo que mida su propio contenido:
  con la cabecera que le metemos —marca, tenant, reloj del canal y los relojes de los jobs— más la
  lista de secciones, pasa de la pantalla y quien acaba desplazándose es la PÁGINA entera. El `nav`
  ya trae `overflow-y-auto`, pero nunca llegaba a activarse porque no tenía altura que respetar.

  Con `lg:h-screen` la tiene y el menú se desplaza solo; `lg:sticky top-0` lo deja anclado si algún
  día la página vuelve a crecer por otro motivo. En móvil no hacía falta: allí ya es `fixed
  inset-y-0`. El orden importa —`sidebarClassName` va el último en el `cn` del componente— así que
  `lg:sticky` gana sobre el `lg:static` de base por tailwind-merge (comprobado: lo elimina).

  `lg:bottom-auto` suelta el `bottom:0` que trae `inset-y-0` para el caso móvil. Un sticky con top y
  bottom a la vez se ata por arriba igual, pero dejarlo puesto sería pedirle al navegador que
  resuelva una restricción que no queremos y que no aporta nada.
-->
<j-sidebar-layout
  [nav]="nav()"
  [activeKey]="activeKey()"
  [collapsible]="true"
  sidebarClassName="lg:sticky lg:top-0 lg:bottom-auto lg:h-screen"
  (navItemClick)="onNav($event)"
>
  <div jHeader class="flex min-w-0 flex-col gap-2">
    <div class="flex items-center gap-2">
      <span
        class="grid h-8 w-8 shrink-0 place-items-center rounded-md bg-primary-600 text-sm font-black text-white"
        >H2H</span
      >
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold leading-tight text-neutral-900">Consola H2H</p>
        <p class="truncate text-[11px] leading-tight text-neutral-400">Jofrantoba Consulting TI</p>
      </div>
    </div>

    <div class="flex min-w-0 items-center gap-1.5">
      <span class="truncate text-xs font-medium text-neutral-600">{{
        tenant()?.org_v_nombrecomercial
      }}</span>
      <j-badge [variant]="ambienteVariant()">{{ tenant()?.org_v_ambiente }}</j-badge>
    </div>

    <!--
      Reloj del canal. En un canal por ventanas, la pregunta operativa más
      frecuente no es "qué hay pendiente" sino "cuánto me queda para el corte".
      Por eso vive en la cabecera, visible desde cualquier pantalla.
    -->
    <app-reloj-canal [compacta]="true" />

    <!--
      Relojes de los jobs, debajo del reloj del canal: aquel dice hasta cuando se puede enviar y
      estos cuando el sistema va a mover algo por su cuenta. Aqui van en una linea por job; el
      detalle (que hace cada uno, su cron) esta en el panel de control.
    -->
    <app-relojes-jobs [compacta]="true" />
  </div>

  <div jFooter class="flex flex-col gap-2">
    <j-user-avatar [name]="user()?.name ?? ''" [email]="user()?.email" size="sm" />
    <button
      type="button"
      (click)="logout()"
      class="inline-flex items-center gap-2 rounded-md px-3 py-1.5 text-sm text-neutral-500 transition-colors hover:bg-neutral-100 hover:text-danger-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Cerrar sesión
    </button>
  </div>

  <router-outlet />
</j-sidebar-layout>
