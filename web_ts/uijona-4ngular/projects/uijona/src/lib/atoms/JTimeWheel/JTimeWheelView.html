<!--
  JTimeWheelView.html — JONA View (template puro)

  Cada columna es un `spinbutton`: además del gesto de rueda responde a las
  flechas, RePág/AvPág e Inicio/Fin. Una rueda que solo entiende scroll deja
  fuera al teclado, y este control acaba fijando la hora a la que sale dinero.
-->
<div
  [class]="raizClasses()"
  [style.height.px]="altoTotal()"
  role="group"
  [attr.aria-label]="'Selector de hora'"
  [attr.aria-disabled]="disabled() ? true : null"
>
  <!-- Banda del centro: marca cuál es el valor elegido. -->
  <div [class]="bandaClasses" [style.top.px]="offsetCentro()" [style.height.px]="altoFila"></div>

  @for (col of columnas(); track col.parte; let ultima = $last) {
    <div
      #columna
      [class]="columnaClasses"
      [attr.data-parte]="col.parte"
      role="spinbutton"
      [tabindex]="disabled() ? -1 : 0"
      [attr.aria-label]="col.etiqueta"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="col.max"
      [attr.aria-valuenow]="col.actual"
      [attr.aria-valuetext]="pad2(col.actual) + ' ' + col.etiqueta"
      (scroll)="onScroll(col.parte, $event)"
      (keydown)="onKeydown(col.parte, $event)"
    >
      <!-- Relleno superior: permite que el primer valor llegue al centro. -->
      <div [style.height.px]="offsetCentro()" aria-hidden="true"></div>

      @for (v of col.valores; track v) {
        <div
          class="jtimewheel-item"
          [class]="itemClasses(col.actual, v)"
          [style.height.px]="altoFila"
          (click)="seleccionar(col.parte, v)"
        >
          {{ pad2(v) }}
        </div>
      }

      <div [style.height.px]="offsetCentro()" aria-hidden="true"></div>
    </div>

    @if (!ultima) {
      <span [class]="separadorClasses" aria-hidden="true">:</span>
    }
  }
</div>
