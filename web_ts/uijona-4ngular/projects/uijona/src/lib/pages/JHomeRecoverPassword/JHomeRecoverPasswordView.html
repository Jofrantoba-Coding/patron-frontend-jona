<!--
  JHomeRecoverPasswordView.html — JONA View (template puro)
  Sin logica: solo estructura y bindings.
-->
<j-border-layout>
  <j-header-page jNorth [title]="appTitle()" />
  <j-footer-page jSouth [text]="footerText()" />
  <j-recover-password
    [(email)]="email"
    [emailError]="emailError()"
    [alertMessage]="alertMessage()"
    [successMessage]="successMessage()"
    [isLoading]="isLoading()"
    (submitted)="submitted.emit($event)"
    (goToLogin)="goToLogin.emit()"
  />
</j-border-layout>
